[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-gravityui-graph"
version = "0.1.0"
description = "A Reflex custom component wrapping @gravity-ui/graph (a high-performance Canvas + React graph/flowchart/node-editor visualization library)."
readme = "README.md"
# Reflex 0.9 dropped Python 3.9; the official custom-component template pins >=3.10.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
# "reflex-custom-components" is required for Reflex gallery / PyPI discovery.
keywords = [
    "reflex",
    "reflex-custom-components",
    "gravity-ui",
    "graph",
    "flowchart",
    "node-editor",
    "diagram",
    "canvas",
    "visualization",
    "component",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["reflex>=0.8.0"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-gravityui-graph"
Repository = "https://github.com/ecrespo/reflex-gravityui-graph"
Issues = "https://github.com/ecrespo/reflex-gravityui-graph/issues"
"@gravity-ui/graph" = "https://github.com/gravity-ui/graph"

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_gravityui_graph = ["*.pyi", "*.jsx"]

[tool.pytest.ini_options]
pythonpath = ["custom_components"]
testpaths = ["tests"]
addopts = "-q"
